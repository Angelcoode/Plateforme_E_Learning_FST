<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(${quiz.titre})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/fragments :: navbar}"></nav>

<main class="container my-5 flex-grow-1" style="max-width:760px;">

  <div class="d-flex align-items-center gap-2 mb-4">
    <i class="bi bi-patch-question-fill text-warning fs-4"></i>
    <h1 class="page-title" th:text="${quiz.titre}">Quiz</h1>
  </div>

  <!-- Already taken notice -->
  <div class="alert alert-info border-0 rounded-3 d-flex gap-2 align-items-start"
       th:if="${previousResult != null}">
    <i class="bi bi-info-circle-fill flex-shrink-0 mt-1"></i>
    <div>
      <div class="fw-semibold small">Vous avez déjà passé ce quiz</div>
      <div class="small">Score précédent :
        <strong th:text="${previousResult.score} + '/' + ${previousResult.totalQuestions}">0/0</strong>.
        Vous pouvez le repasser.
      </div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>
        <i class="bi bi-question-circle me-1"></i>
        <span th:text="${#lists.size(quiz.questions)}">0</span> questions
      </span>
      <span class="badge bg-warning text-dark">Sélectionnez une réponse par question</span>
    </div>
    <div class="card-body p-4">
      <!-- FIX : th:action corrigé — plus de crochets Markdown autour de quiz.id -->
      <form th:action="@{/ui/quiz/{id}/submit(id=${quiz.id})}" method="post">
        <div class="vstack gap-5">
          <div th:each="q, qs : ${quiz.questions}">
            <div class="fw-semibold mb-3">
              <span class="badge bg-primary rounded-pill me-2" th:text="${qs.count}">1</span>
              <span th:text="${q.text}">Question ?</span>
            </div>
            <div class="vstack gap-2">
              <!-- FIX : th:name corrigé — plus de crochets Markdown autour de q.id -->
              <label class="quiz-option" th:each="opt : ${ {'A','B','C','D'} }">
                <input type="radio"
                       class="form-check-input flex-shrink-0"
                       th:name="'q_' + ${q.id}"
                       th:value="${opt}"
                       required/>
                <div class="option-label" th:text="${opt}">A</div>
                <span class="small"
                      th:text="${opt == 'A' ? q.optionA :
                                (opt == 'B' ? q.optionB :
                                (opt == 'C' ? q.optionC : q.optionD))}">Option</span>
              </label>
            </div>
          </div>
        </div>

        <hr class="my-4"/>

        <button class="btn btn-primary px-5 py-2" type="submit">
          <i class="bi bi-send-check me-1"></i>Soumettre mes réponses
        </button>
      </form>
    </div>
  </div>
</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
