<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Mes Paiements')}"></head>

<style>
  body {
    background: linear-gradient(135deg, #f5f7fa, #e9eff7);
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .animated-page {
    animation: fadeUp .7s ease-in-out;
  }

  .page-title {
    font-size: 2rem;
    font-weight: 700;
    color: #1f2937;
  }

  .modern-card {
    border: none;
    border-radius: 18px;
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(8px);
    box-shadow: 0 12px 28px rgba(0,0,0,.08);
    transition: all .3s ease;
  }

  .modern-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 32px rgba(0,0,0,.12);
  }

  .table thead {
    background: #f8fafc;
  }

  .table tbody tr {
    transition: all .25s ease;
  }

  .table tbody tr:hover {
    background: #f8fbff;
    transform: scale(1.002);
  }

  .status-badge {
    padding: 6px 12px;
    border-radius: 999px;
    font-size: .75rem;
    font-weight: 600;
  }

  .status-valid {
    background: #dcfce7;
    color: #166534;
  }

  .status-wait {
    background: #fef3c7;
    color: #92400e;
  }

  .status-refuse {
    background: #fee2e2;
    color: #991b1b;
  }

  .btn-primary {
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg,#2563eb,#1d4ed8);
    box-shadow: 0 8px 18px rgba(37,99,235,.25);
    transition: all .3s ease;
  }

  .btn-primary:hover,
  .btn-outline-primary:hover {
    transform: translateY(-2px);
  }

  .btn-outline-primary {
    border-radius: 12px;
  }

  .empty-state {
    animation: fadeUp .8s ease;
  }
</style>

<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/fragments :: navbar}"></nav>

<main class="container my-5 flex-grow-1 animated-page">

  <!-- Header -->
  <div class="page-header d-flex justify-content-between align-items-start mb-4">
    <div>
      <h1 class="page-title">
        <i class="bi bi-receipt text-primary me-2"></i>Mes Paiements
      </h1>
      <p class="text-muted small mt-1 mb-0">Historique de vos transactions</p>
    </div>

    <a th:href="@{/ui/cours}" class="btn btn-outline-primary btn-sm rounded-pill px-3">
      <i class="bi bi-collection-play me-1"></i>Voir les cours
    </a>
  </div>

  <!-- Tableau -->
  <div class="modern-card" th:if="${not #lists.isEmpty(paiements)}">
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead>
          <tr>
            <th class="ps-3">Référence</th>
            <th>Cours</th>
            <th>Montant</th>
            <th>Méthode</th>
            <th>Date</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="p : ${paiements}">
            <td class="ps-3">
              <span class="font-monospace small fw-semibold text-primary"
                    th:text="${p.reference}">
              </span>
            </td>

            <td>
              <a th:href="@{/ui/cours/{id}(id=${p.cours.id})}"
                 class="text-decoration-none fw-semibold small text-dark"
                 th:text="${p.cours.titre}">
                Cours
              </a>
            </td>

            <td>
              <span class="fw-bold text-primary"
                    th:text="${#numbers.formatDecimal(p.montant,1,2)} + ' TND'">
              </span>
            </td>

            <td>
              <span class="badge bg-light text-dark border small"
                    th:text="${p.methode ?: '—'}">
              </span>
            </td>

            <td>
              <span class="small text-muted"
                    th:text="${#temporals.format(p.dateCreation,'dd/MM/yyyy')}">
              </span>
            </td>

            <td>
              <span class="status-badge"
                    th:classappend="${p.statut.name() == 'VALIDE'} ? ' status-valid' :
                                    (${p.statut.name() == 'EN_ATTENTE'} ? ' status-wait' : ' status-refuse')"
                    th:text="${p.statut}">
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Etat vide -->
  <div th:if="${#lists.isEmpty(paiements)}" class="text-center py-5 empty-state">
    <div class="modern-card p-5">
      <i class="bi bi-receipt text-muted" style="font-size:3rem;"></i>
      <h3 class="h5 mt-3 fw-bold">Aucun paiement trouvé</h3>
      <p class="text-muted small">Inscrivez-vous à un cours pour commencer.</p>
      <a th:href="@{/ui/cours}" class="btn btn-primary rounded-pill px-4 mt-2">
        Voir le catalogue
      </a>
    </div>
  </div>

</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<div th:replace="~{layout/fragments :: scripts}"></div>

</body>
</html>
