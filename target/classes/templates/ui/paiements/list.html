<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/fragments :: head('Gestion des Paiements')}"></head>

<style>
  body{
    background: linear-gradient(135deg,#f5f7fa,#e9eff7);
  }

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
  }

  .animated-page{
    animation:fadeUp .7s ease-in-out;
  }

  .page-title{
    font-size:2rem;
    font-weight:700;
    color:#1f2937;
  }

  /* Cards */
  .stat-card,
  .modern-card{
    border:none;
    border-radius:18px;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(8px);
    box-shadow:0 12px 28px rgba(0,0,0,.08);
    transition:all .3s ease;
  }

  .stat-card:hover,
  .modern-card:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 32px rgba(0,0,0,.12);
  }

  /* Table */
  .table thead{
    background:#f8fafc;
  }

  .table tbody tr{
    transition:all .25s ease;
  }

  .table tbody tr:hover{
    background:#f8fbff;
    transform:scale(1.002);
  }

  /* Buttons */
  .btn-primary{
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    box-shadow:0 8px 18px rgba(37,99,235,.25);
  }

  .btn-success,
  .btn-danger,
  .btn-warning{
    border-radius:10px;
    transition:all .25s ease;
  }

  .btn-success:hover,
  .btn-danger:hover,
  .btn-warning:hover{
    transform:translateY(-2px);
  }

  /* Badges */
  .status-badge{
    padding:6px 12px;
    border-radius:999px;
    font-size:.75rem;
    font-weight:600;
  }

  .status-valid{ background:#dcfce7; color:#166534; }
  .status-wait{ background:#fef3c7; color:#92400e; }
  .status-refuse{ background:#fee2e2; color:#991b1b; }

  /* Pagination */
  .page-link{
    border:none;
    border-radius:10px;
    margin:0 3px;
    color:#2563eb;
  }

  .page-item.active .page-link{
    background:#2563eb;
    color:white;
  }

  .page-link:hover{
    background:#dbeafe;
  }
</style>

<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/fragments :: navbar}"></nav>

<main class="container my-5 flex-grow-1 animated-page">

  <!-- Header -->
  <div class="page-header d-flex justify-content-between align-items-start mb-4">
    <div>
      <h1 class="page-title">
        <i class="bi bi-credit-card text-primary me-2"></i>Paiements
      </h1>
      <p class="text-muted small mb-0">Gestion de toutes les transactions financières</p>
    </div>
    <span class="badge bg-primary px-3 py-2 rounded-pill">
      <i class="bi bi-shield-check me-1"></i>ADMIN
    </span>
  </div>

  <!-- Flash messages -->
  <div class="alert alert-success shadow-sm border-0 rounded-3"
       th:if="${successMsg}">
    <i class="bi bi-check-circle-fill me-2"></i>
    <span th:text="${successMsg}"></span>
  </div>

  <div class="alert alert-danger shadow-sm border-0 rounded-3"
       th:if="${errorMsg}">
    <i class="bi bi-x-circle-fill me-2"></i>
    <span th:text="${errorMsg}"></span>
  </div>

  <!-- Stats -->
  <div class="row g-3 mb-5">
    <div class="col-6 col-lg-3">
      <div class="stat-card h-100">
        <div class="card-body p-3">
          <div class="text-muted small">Revenu validé</div>
          <div class="fw-bold fs-4 text-primary"
               th:text="${#numbers.formatDecimal(totalRevenu,1,2)} + ' TND'">0</div>
        </div>
      </div>
    </div>

    <div class="col-6 col-lg-3">
      <div class="stat-card h-100">
        <div class="card-body p-3">
          <div class="text-muted small">En attente</div>
          <div class="fw-bold fs-4 text-warning"
               th:text="${nbEnAttente}">0</div>
        </div>
      </div>
    </div>

    <div class="col-6 col-lg-3">
      <div class="stat-card h-100">
        <div class="card-body p-3">
          <div class="text-muted small">Validés</div>
          <div class="fw-bold fs-4 text-success"
               th:text="${nbValide}">0</div>
        </div>
      </div>
    </div>

    <div class="col-6 col-lg-3">
      <div class="stat-card h-100">
        <div class="card-body p-3">
          <div class="text-muted small">Refusés</div>
          <div class="fw-bold fs-4 text-danger"
               th:text="${page.totalElements - nbValide - nbEnAttente}">0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="modern-card mb-4">
    <div class="card-body d-flex flex-wrap gap-2 align-items-center p-3">
      <span class="text-muted small fw-semibold">Filtrer :</span>

      <a th:href="@{/ui/paiements}"
         class="btn btn-sm rounded-pill"
         th:classappend="${filtreStatut == null} ? 'btn-primary' : 'btn-outline-secondary'">
        Tous
      </a>

      <a th:each="s : ${statuts}"
         th:href="@{/ui/paiements(statut=${s.name()})}"
         class="btn btn-sm rounded-pill"
         th:classappend="${filtreStatut == s.name()} ? 'btn-primary' : 'btn-outline-secondary'"
         th:text="${s.name()}"></a>
    </div>
  </div>

  <!-- Table -->
  <div class="modern-card">
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead>
          <tr>
            <th>Référence</th>
            <th>Apprenant</th>
            <th>Cours</th>
            <th>Montant</th>
            <th>Méthode</th>
            <th>Date</th>
            <th>Statut</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="p : ${paiements}">
            <td class="fw-semibold text-primary" th:text="${p.reference}"></td>
            <td>
              <div class="fw-semibold small" th:text="${p.apprenant.nom}"></div>
              <div class="text-muted small" th:text="${p.apprenant.email}"></div>
            </td>
            <td th:text="${p.cours.titre}"></td>
            <td class="fw-bold text-primary"
                th:text="${#numbers.formatDecimal(p.montant,1,2)} + ' TND'"></td>
            <td th:text="${p.methode ?: '—'}"></td>
            <td th:text="${#temporals.format(p.dateCreation,'dd/MM/yyyy')}"></td>
            <td>
              <span class="status-badge"
                    th:classappend="${p.statut.name() == 'VALIDE'} ? ' status-valid' :
                                    (${p.statut.name() == 'EN_ATTENTE'} ? ' status-wait' : ' status-refuse')"
                    th:text="${p.statut}">
              </span>
            </td>
            <td class="text-end">
              <div class="d-flex justify-content-end gap-1">
                <form th:if="${p.statut.name() == 'EN_ATTENTE'}"
                      th:action="@{/ui/paiements/{id}/valider(id=${p.id})}" method="post">
                  <button class="btn btn-success btn-sm"><i class="bi bi-check-lg"></i></button>
                </form>

                <form th:if="${p.statut.name() == 'EN_ATTENTE'}"
                      th:action="@{/ui/paiements/{id}/refuser(id=${p.id})}" method="post">
                  <button class="btn btn-danger btn-sm"><i class="bi bi-x-lg"></i></button>
                </form>

                <form th:if="${p.statut.name() == 'VALIDE'}"
                      th:action="@{/ui/paiements/{id}/rembourser(id=${p.id})}" method="post">
                  <button class="btn btn-warning btn-sm"><i class="bi bi-arrow-counterclockwise"></i></button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="card-footer bg-transparent border-0 d-flex justify-content-center py-3"
         th:if="${page.totalPages > 1}">
      <ul class="pagination pagination-sm mb-0">
        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:classappend="${i == page.number} ? 'active'">
          <a class="page-link"
             th:href="@{/ui/paiements(page=${i})}"
             th:text="${i + 1}"></a>
        </li>
      </ul>
    </div>
  </div>

</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<div th:replace="~{layout/fragments :: scripts}"></div>

</body>
</html>
