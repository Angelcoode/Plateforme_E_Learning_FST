<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${title} + ' | E-Learning FST'">E-Learning FST</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm" style="background: #1e293b;">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
      <div class="d-flex align-items-center justify-content-center rounded-2 bg-primary" style="width:32px;height:32px;">
        <i class="bi bi-mortarboard-fill text-white" style="font-size:1rem;"></i>
      </div>
      <span>E-Learning <span class="text-primary">FST</span></span>
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-3">
        <li class="nav-item">
          <a class="nav-link px-2" th:href="@{/ui/cours}"><i class="bi bi-collection-play me-1"></i>Catalogue</a>
        </li>
        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','FORMATEUR')">
          <a class="nav-link px-2" th:href="@{/ui/modules}"><i class="bi bi-layers me-1"></i>Modules</a>
        </li>
        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','FORMATEUR')">
          <a class="nav-link px-2" th:href="@{/ui/lecons}"><i class="bi bi-file-earmark-play me-1"></i>Leçons</a>
        </li>
        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','FORMATEUR')">
          <a class="nav-link px-2" th:href="@{/ui/inscriptions}"><i class="bi bi-person-check me-1"></i>Inscriptions</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link px-2" th:href="@{/ui/utilisateurs}"><i class="bi bi-people me-1"></i>Utilisateurs</a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
        <div class="d-flex align-items-center gap-2 text-white-50" sec:authorize="isAuthenticated()">
          <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center" style="width:32px;height:32px;">
            <i class="bi bi-person-fill text-white" style="font-size:0.85rem;"></i>
          </div>
          <div>
            <div class="text-white fw-medium" style="font-size:0.85rem;" sec:authentication="name">user</div>
          </div>
        </div>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
          <button class="btn btn-sm btn-outline-light rounded-pill px-3" type="submit">
            <i class="bi bi-box-arrow-right me-1"></i>Quitter
          </button>
        </form>
        <a sec:authorize="!isAuthenticated()" class="btn btn-primary btn-sm px-4 rounded-pill" th:href="@{/login}">Connexion</a>
      </div>
    </div>
  </div>
</nav>

<footer th:fragment="footer" style="background:#1e293b; color:#94a3b8;" class="mt-auto py-4 border-top border-secondary border-opacity-25">
  <div class="container d-flex justify-content-between align-items-center flex-column flex-md-row gap-2">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-mortarboard-fill text-primary"></i>
      <span class="small">&copy; 2026 E-Learning FST — Université de Tunis El Manar</span>
    </div>
    <div class="small d-flex gap-3">
      <span>Spring Boot 3 · Thymeleaf · Bootstrap 5</span>
    </div>
  </div>
</footer>

<div th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
