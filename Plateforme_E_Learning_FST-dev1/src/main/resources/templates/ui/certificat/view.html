<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Certificat de complétion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    body { font-family:'Inter',sans-serif; background:#f1f5f9; }
    .cert-page { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem; }
    .certificate-wrapper { max-width:860px; width:100%; }
    .certificate-frame { border:12px solid #1e293b; border-radius:4px; padding:56px; background:#fff; position:relative; box-shadow:0 20px 60px rgba(0,0,0,0.15); }
    .certificate-inner { border:2px solid #94a3b8; padding:48px; }
    .cert-title { font-family:'Playfair Display',serif; font-size:2.8rem; font-weight:800; color:#1e293b; letter-spacing:-0.02em; }
    .cert-student { font-family:'Playfair Display',serif; font-size:2rem; font-weight:700; color:#4f46e5; border-bottom:3px solid #ede9fe; display:inline-block; padding-bottom:4px; }
    .cert-course { font-family:'Playfair Display',serif; font-size:1.6rem; font-weight:700; color:#1e293b; }
    .cert-seal { width:90px; height:90px; background:radial-gradient(circle,#fbbf24,#f59e0b); border-radius:50%; border:4px solid #d97706; position:absolute; bottom:56px; right:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:0.55rem; text-align:center; letter-spacing:0.05em; text-transform:uppercase; box-shadow:0 4px 20px rgba(245,158,11,0.4); }
    .no-print { }
    @media print { .no-print { display:none !important; } body { background:white !important; } }
  </style>
</head>
<body class="cert-page">

<div class="certificate-wrapper">
  <div class="no-print d-flex justify-content-between align-items-center mb-3">
    <a href="javascript:history.back()" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i>Retour
    </a>
    <button onclick="window.print()" class="btn btn-sm btn-primary">
      <i class="bi bi-printer me-1"></i>Imprimer / Sauvegarder en PDF
    </button>
  </div>

  <div class="certificate-frame">
    <div class="certificate-inner text-center position-relative pb-5">

      <!-- Header -->
      <div class="d-flex align-items-center justify-content-center gap-3 mb-4">
        <div style="width:48px;height:3px;background:#4f46e5;border-radius:2px;"></div>
        <div class="fw-bold text-muted" style="font-size:0.7rem;letter-spacing:0.15em;text-transform:uppercase;">Université de Tunis El Manar — FST</div>
        <div style="width:48px;height:3px;background:#4f46e5;border-radius:2px;"></div>
      </div>

      <h1 class="cert-title mb-2">Certificat de Complétion</h1>
      <p class="text-muted mb-5" style="font-size:1rem;">Ce certificat est décerné à</p>

      <div class="mb-4">
        <div class="cert-student" th:text="${nom}">Nom Prénom</div>
      </div>

      <p class="text-muted mb-3" style="font-size:0.95rem;">pour avoir suivi et complété avec succès la formation</p>

      <div class="mb-5">
        <div class="cert-course" th:text="${cours}">Titre du cours</div>
      </div>

      <div class="row mt-4">
        <div class="col-6 text-start">
          <div class="text-muted small mb-1">Date d'obtention</div>
          <div class="fw-bold" th:text="${#temporals.format(date, 'dd MMMM yyyy')}">01 Janvier 2026</div>
        </div>
        <div class="col-6 text-end">
          <div class="fw-bold border-top border-dark d-inline-block pt-2 mt-2">
            Direction des Études
          </div>
        </div>
      </div>
    </div>

    <div class="cert-seal">
      E-LEARNING<br>FST<br>
      <i class="bi bi-patch-check-fill mt-1" style="font-size:1.5rem;"></i>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
