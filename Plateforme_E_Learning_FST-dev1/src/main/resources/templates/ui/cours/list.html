<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/fragments :: head('Catalogue des cours')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/fragments :: navbar}"></nav>

<main class="container my-5 flex-grow-1">
  <div class="page-header d-flex justify-content-between align-items-center">
    <div>
      <h1 class="page-title"><i class="bi bi-collection-play text-primary me-2"></i>Catalogue des cours</h1>
      <p class="text-muted small mt-1 mb-0" th:text="${page.totalElements} + ' cours disponibles'">N cours</p>
    </div>
    <a sec:authorize="hasAnyRole('ADMIN','FORMATEUR')" class="btn btn-primary" th:href="@{/ui/cours/new}">
      <i class="bi bi-plus-lg me-1"></i>Nouveau cours
    </a>
  </div>

  <!-- Course cards grid -->
  <div class="row g-4 mb-5" th:if="${not #lists.isEmpty(cours)}">
    <div class="col-sm-6 col-lg-4" th:each="c : ${cours}">
      <div class="card course-card h-100 shadow-sm card-hover">
        <div class="position-relative">
          <div class="card-img-top d-flex align-items-center justify-content-center"
               th:style="${c.imageUrl != null and not #strings.isEmpty(c.imageUrl)} ? 'background:url(' + c.imageUrl + ') center/cover; height:180px;' : 'background:linear-gradient(135deg,#ede9fe,#ddd6fe);height:180px;'">
            <i class="bi bi-play-circle text-primary opacity-50" style="font-size:3rem;"
               th:if="${c.imageUrl == null or #strings.isEmpty(c.imageUrl)}"></i>
          </div>
          <span class="badge-level badge text-bg-primary" th:text="${c.niveau}">NIVEAU</span>
          <span th:if="${not c.actif}" class="badge text-bg-secondary position-absolute top-0 end-0 m-2">Inactif</span>
        </div>
        <div class="card-body d-flex flex-column p-3">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="badge bg-primary bg-opacity-10 text-primary fw-normal rounded-pill small" th:text="${c.categorie ?: 'Général'}">Cat</span>
            <span class="text-muted" style="font-size:0.75rem;" th:text="${c.formateur != null ? c.formateur.nom : '—'}">Formateur</span>
          </div>
          <h3 class="card-title h6 fw-bold mb-2" th:text="${c.titre}">Titre</h3>
          <p class="text-muted small flex-grow-1 mb-3"
             th:text="${#strings.abbreviate(c.description ?: '', 90)}">Description</p>
          <div class="d-flex gap-2 mt-auto">
            <a class="btn btn-primary btn-sm flex-grow-1" th:href="@{/ui/cours/{id}(id=${c.id})}">
              <i class="bi bi-eye me-1"></i>Voir
            </a>
            <a sec:authorize="hasAnyRole('ADMIN','FORMATEUR')"
               class="btn btn-outline-secondary btn-sm btn-icon"
               th:href="@{/ui/cours/{id}/edit(id=${c.id})}" title="Modifier">
              <i class="bi bi-pencil"></i>
            </a>
            <form sec:authorize="hasAnyRole('ADMIN','FORMATEUR')"
                  th:action="@{/ui/cours/{id}/delete(id=${c.id})}" method="post" class="m-0"
                  onsubmit="return confirm('Supprimer ce cours ?');">
              <button class="btn btn-outline-danger btn-sm btn-icon" type="submit" title="Supprimer">
                <i class="bi bi-trash"></i>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div class="text-center py-5" th:if="${#lists.isEmpty(cours)}">
    <i class="bi bi-collection text-muted" style="font-size:3.5rem;"></i>
    <h3 class="h5 mt-3">Aucun cours disponible</h3>
    <p class="text-muted">Créez votre premier cours pour commencer.</p>
    <a sec:authorize="hasAnyRole('ADMIN','FORMATEUR')" th:href="@{/ui/cours/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i>Créer un cours
    </a>
  </div>

  <!-- Pagination -->
  <nav th:if="${page.totalPages > 1}" aria-label="Pagination des cours">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:classappend="${page.first} ? 'disabled'">
        <a class="page-link rounded-start-pill" th:href="@{/ui/cours(page=${page.number - 1})}">
          <i class="bi bi-chevron-left"></i>
        </a>
      </li>
      <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
          th:classappend="${i == page.number} ? 'active'">
        <a class="page-link" th:href="@{/ui/cours(page=${i})}" th:text="${i + 1}">1</a>
      </li>
      <li class="page-item" th:classappend="${page.last} ? 'disabled'">
        <a class="page-link rounded-end-pill" th:href="@{/ui/cours(page=${page.number + 1})}">
          <i class="bi bi-chevron-right"></i>
        </a>
      </li>
    </ul>
  </nav>
</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
