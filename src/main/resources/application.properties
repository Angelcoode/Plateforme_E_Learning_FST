spring.application.name=elearning

# ── H2 embedded database (development – no MySQL needed) ──
spring.datasource.url=jdbc:h2:file:./data/elearning_fst;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── MySQL (production) – uncomment and disable H2 above ──
# spring.datasource.url=jdbc:mysql://localhost:3306/elearning_fst?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Run data.sql after JPA schema
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
