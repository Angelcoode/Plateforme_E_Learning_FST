<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/fragments :: head(${utilisateur.id} != null ? 'Modifier utilisateur' : 'Nouvel utilisateur')"></head>
<body>
<div th:replace="layout/fragments :: navbar"></div>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 m-0" th:text="${utilisateur.id} != null ? 'Modifier utilisateur' : 'Nouvel utilisateur'">Utilisateur</h1>
    <a class="btn btn-outline-secondary" th:href="@{/ui/utilisateurs}">Retour</a>
  </div>

  <div class="card">
    <div class="card-body">
      <form th:object="${utilisateur}"
            th:action="${utilisateur.id} != null ? @{|/ui/utilisateurs/${utilisateur.id}|} : @{/ui/utilisateurs}"
            method="post" class="row g-3">

        <div class="col-12 col-md-6">
          <label class="form-label">Nom</label>
          <input class="form-control" th:field="*{nom}" required />
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" th:field="*{email}" required />
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label">Mot de passe</label>
          <input class="form-control" type="password" th:field="*{password}" />
          <div class="form-text">Note: ce projet ne chiffre pas encore le mot de passe.</div>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label">Rôle</label>
          <select class="form-select" th:field="*{role}">
            <option value="" disabled th:selected="${utilisateur.role == null}">Choisir...</option>
            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">ADMIN</option>
          </select>
        </div>

        <div class="col-12">
          <button class="btn btn-dark" type="submit">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</main>

<div th:replace="layout/fragments :: footer"></div>
<div th:replace="layout/fragments :: scripts"></div>
</body>
</html>
