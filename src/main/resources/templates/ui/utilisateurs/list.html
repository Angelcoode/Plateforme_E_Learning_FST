<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/fragments :: head('Utilisateurs')"></head>
<body>
<div th:replace="layout/fragments :: navbar"></div>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 m-0">Utilisateurs</h1>
    <a class="btn btn-dark" th:href="@{/ui/utilisateurs/new}">Nouvel utilisateur</a>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-striped align-middle mb-0">
        <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Email</th>
          <th>Rôle</th>
          <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${utilisateurs}">
          <td th:text="${u.id}">1</td>
          <td th:text="${u.nom}">Nom</td>
          <td th:text="${u.email}">email</td>
          <td><span class="badge text-bg-secondary" th:text="${u.role}">ADMIN</span></td>
          <td class="text-end">
            <a class="btn btn-outline-primary btn-sm" th:href="@{|/ui/utilisateurs/${u.id}/edit|}">Modifier</a>
            <form th:action="@{|/ui/utilisateurs/${u.id}/delete|}" method="post" class="d-inline">
              <button class="btn btn-outline-danger btn-sm" type="submit"
                      onclick="return confirm('Supprimer cet utilisateur ?');">Supprimer</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(utilisateurs)}">
          <td colspan="4" class="text-center text-muted py-4">Aucun utilisateur.</td>
          <td></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div th:replace="layout/fragments :: footer"></div>
<div th:replace="layout/fragments :: scripts"></div>
</body>
</html>
