<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Utilisateurs')}"></head>

<style>
  body {
    background: linear-gradient(135deg, #f5f7fa, #e9eff7);
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(25px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .animated-page {
    animation: fadeUp 0.7s ease-in-out;
  }

  .page-title {
    font-size: 2rem;
    font-weight: 700;
    color: #1f2937;
  }

  .modern-card {
    border: none;
    border-radius: 18px;
    overflow: hidden;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
  }

  .table thead {
    background: #f8fafc;
  }

  .table tbody tr {
    transition: all 0.25s ease;
  }

  .table tbody tr:hover {
    background: #f8fbff;
    transform: scale(1.002);
  }

  .btn-primary {
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    box-shadow: 0 6px 16px rgba(37,99,235,0.25);
  }

  .btn-outline-primary,
  .btn-outline-danger {
    border-radius: 10px;
  }

  .role-badge {
    padding: 6px 12px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.8rem;
  }

  .admin { background: #fee2e2; color: #b91c1c; }
  .formateur { background: #dcfce7; color: #166534; }
  .etudiant { background: #dbeafe; color: #1d4ed8; }
</style>

<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/fragments :: navbar}"></nav>

<main class="container my-5 flex-grow-1 animated-page">

  <div class="page-header d-flex justify-content-between align-items-center mb-4">
    <h1 class="page-title">
      <i class="bi bi-people text-primary me-2"></i>Utilisateurs
    </h1>
    <a class="btn btn-primary" th:href="@{/ui/utilisateurs/new}">
      <i class="bi bi-person-plus me-1"></i>Nouvel utilisateur
    </a>
  </div>

  <div class="card modern-card">
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Email</th>
            <th>Rôle</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="u : ${utilisateurs}">
            <td class="text-muted small" th:text="${u.id}">1</td>
            <td class="fw-semibold" th:text="${u.nom}">Nom</td>
            <td class="text-muted small" th:text="${u.email}">email@fst.ma</td>
            <td>
              <span class="role-badge"
                    th:classappend="${u.role.name() == 'ADMIN'} ? ' admin' :
                                   (${u.role.name() == 'FORMATEUR'} ? ' formateur' : ' etudiant')"
                    th:text="${u.role}">
                ROLE
              </span>
            </td>
            <td class="text-end">
              <a class="btn btn-outline-primary btn-sm me-1"
                 th:href="@{/ui/utilisateurs/{id}/edit(id=${u.id})}">
                <i class="bi bi-pencil"></i>
              </a>
              <form th:action="@{/ui/utilisateurs/{id}/delete(id=${u.id})}"
                    method="post"
                    class="d-inline"
                    onsubmit="return confirm('Supprimer cet utilisateur ?');">
                <button class="btn btn-outline-danger btn-sm"
                        type="submit"
                        th:disabled="${u.role != null and u.role.name() == 'ADMIN' and u.email == 'admin@fst.ma'}">
                  <i class="bi bi-trash"></i>
                </button>
              </form>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(utilisateurs)}">
            <td colspan="5" class="text-center text-muted py-5">
              Aucun utilisateur trouvé.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<div th:replace="~{layout/fragments :: scripts}"></div>

</body>
</html>
