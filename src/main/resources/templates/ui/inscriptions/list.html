<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/fragments :: head('Inscriptions')"></head>
<body>
<div th:replace="layout/fragments :: navbar"></div>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 m-0">Inscriptions</h1>
    <a class="btn btn-dark" th:href="@{/ui/inscriptions/new}">Nouvelle inscription</a>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-striped align-middle mb-0">
        <thead>
        <tr>
          <th>ID</th>
          <th>Apprenant</th>
          <th>Cours</th>
          <th>Date</th>
          <th>Statut</th>
          <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="i : ${inscriptions}">
          <td th:text="${i.id}">1</td>
          <td th:text="${i.apprenant != null ? i.apprenant.nom : '-'}">-</td>
          <td th:text="${i.cours != null ? i.cours.titre : '-'}">-</td>
          <td th:text="${i.dateInscription}">2026-01-01</td>
          <td><span class="badge text-bg-secondary" th:text="${i.statut}">EN_ATTENTE</span></td>
          <td class="text-end">
            <a class="btn btn-outline-primary btn-sm" th:href="@{|/ui/inscriptions/${i.id}/edit|}">Modifier</a>
            <form th:action="@{|/ui/inscriptions/${i.id}/delete|}" method="post" class="d-inline">
              <button class="btn btn-outline-danger btn-sm" type="submit"
                      onclick="return confirm('Supprimer cette inscription ?');">Supprimer</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(inscriptions)}">
          <td colspan="5" class="text-center text-muted py-4">Aucune inscription.</td>
          <td></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div th:replace="layout/fragments :: footer"></div>
<div th:replace="layout/fragments :: scripts"></div>
</body>
</html>
