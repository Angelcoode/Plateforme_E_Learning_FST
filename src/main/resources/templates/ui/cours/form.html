<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/fragments :: head(${cours.id} != null ? 'Modifier cours' : 'Nouveau cours')"></head>
<body>
<div th:replace="layout/fragments :: navbar"></div>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 m-0" th:text="${cours.id} != null ? 'Modifier cours' : 'Nouveau cours'">Cours</h1>
    <a class="btn btn-outline-secondary" th:href="@{/ui/cours}">Retour</a>
  </div>

  <div class="card">
    <div class="card-body">
      <form th:object="${cours}"
            th:action="${cours.id} != null ? @{|/ui/cours/${cours.id}|} : @{/ui/cours}"
            method="post" class="row g-3">

        <div class="col-12">
          <label class="form-label">Titre</label>
          <input class="form-control" th:field="*{titre}" required />
        </div>

        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea class="form-control" rows="4" th:field="*{description}"></textarea>
        </div>

        <div class="col-12 col-md-4">
          <label class="form-label">Catégorie</label>
          <input class="form-control" th:field="*{categorie}" />
        </div>

        <div class="col-12 col-md-4">
          <label class="form-label">Niveau</label>
          <select class="form-select" th:field="*{niveau}">
            <option value="" disabled th:selected="${cours.niveau == null}">Choisir...</option>
            <option th:each="n : ${niveaux}" th:value="${n}" th:text="${n}">DEBUTANT</option>
          </select>
        </div>

        <div class="col-12 col-md-4">
          <label class="form-label">Formateur</label>
          <select class="form-select" name="formateurId">
            <option value="" th:selected="${cours.formateur == null}">—</option>
            <option th:each="u : ${formateurs}"
                    th:value="${u.id}"
                    th:selected="${cours.formateur != null and cours.formateur.id == u.id}"
                    th:text="${u.nom + ' (' + u.email + ')'}">User</option>
          </select>
          <div class="form-text">Les utilisateurs sont gérés dans “Utilisateurs”.</div>
        </div>

        <div class="col-12 col-md-8">
          <label class="form-label">Image URL</label>
          <input class="form-control" th:field="*{imageUrl}" />
        </div>

        <div class="col-12 col-md-4">
          <label class="form-label">Actif</label>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" th:field="*{actif}" />
            <label class="form-check-label">Visible pour les apprenants</label>
          </div>
        </div>

        <div class="col-12">
          <button class="btn btn-dark" type="submit">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</main>

<div th:replace="layout/fragments :: footer"></div>
<div th:replace="layout/fragments :: scripts"></div>
</body>
</html>
