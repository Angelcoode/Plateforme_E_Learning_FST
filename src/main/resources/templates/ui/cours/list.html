<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/fragments :: head('Catalogue des cours')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/fragments :: navbar}"></nav>

<main class="flex-grow-1">

  <!-- Hero band -->
  <div class="py-4 px-3" style="background:linear-gradient(120deg,#1e293b,#312e81);">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div>
        <h1 class="h4 fw-bold text-white mb-1">
          <i class="bi bi-collection-play me-2 text-primary"></i>Catalogue des cours
        </h1>
        <p class="text-white-50 small mb-0" th:text="${page.totalElements} + ' cours disponibles'">N cours</p>
      </div>
      <a sec:authorize="hasAnyRole('ADMIN','FORMATEUR')" class="btn btn-primary rounded-pill px-4"
         th:href="@{/ui/cours/new}">
        <i class="bi bi-plus-lg me-1"></i>Nouveau cours
      </a>
    </div>
  </div>

  <div class="container my-5">

    <!-- Flash messages -->
    <div class="alert alert-success border-0 rounded-3 d-flex gap-2 align-items-center"
         th:if="${successMsg}">
      <i class="bi bi-check-circle-fill"></i><span th:text="${successMsg}"></span>
    </div>

    <!-- Filter bar -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body p-3 d-flex flex-wrap gap-2 align-items-center">
        <span class="text-muted small fw-semibold"><i class="bi bi-funnel me-1"></i>Niveau :</span>
        <a th:href="@{/ui/cours}" class="btn btn-sm rounded-pill btn-primary">Tous</a>
        <a th:href="@{/ui/cours(niveau='DEBUTANT')}" class="btn btn-sm rounded-pill btn-outline-secondary">Débutant</a>
        <a th:href="@{/ui/cours(niveau='INTERMEDIAIRE')}" class="btn btn-sm rounded-pill btn-outline-secondary">Intermédiaire</a>
        <a th:href="@{/ui/cours(niveau='AVANCE')}" class="btn btn-sm rounded-pill btn-outline-secondary">Avancé</a>
        <div class="ms-auto d-flex align-items-center gap-2">
          <span class="text-muted small fw-semibold"><i class="bi bi-tag me-1"></i>Prix :</span>
          <a th:href="@{/ui/cours(gratuit=true)}" class="btn btn-sm rounded-pill btn-outline-success">
            <i class="bi bi-gift me-1"></i>Gratuits
          </a>
        </div>
      </div>
    </div>

    <!-- Course grid -->
    <div class="row g-4 mb-5" th:if="${not #lists.isEmpty(cours)}">
      <div class="col-sm-6 col-lg-4" th:each="c : ${cours}">
        <div class="card course-card h-100 shadow-sm border-0">

          <!-- Image -->
          <div class="position-relative">
            <div class="card-img-top d-flex align-items-center justify-content-center overflow-hidden"
                 style="height:180px;"
                 th:style="${c.imageUrl != null and not #strings.isEmpty(c.imageUrl)}
                     ? 'background:url(' + c.imageUrl + ') center/cover;height:180px;'
                     : 'background:linear-gradient(135deg,#ede9fe,#ddd6fe);height:180px;'">
              <i class="bi bi-play-circle text-primary opacity-40" style="font-size:3rem;"
                 th:if="${c.imageUrl == null or #strings.isEmpty(c.imageUrl)}"></i>
            </div>
            <!-- Level badge -->
            <span class="badge position-absolute top-0 start-0 m-2 rounded-pill"
                  th:classappend="${c.niveau?.name() == 'DEBUTANT'} ? 'bg-success' :
                                  (${c.niveau?.name() == 'INTERMEDIAIRE'} ? 'bg-warning text-dark' : 'bg-danger')"
                  th:text="${c.niveau}">NIVEAU</span>
            <!-- Price badge -->
            <span class="badge position-absolute top-0 end-0 m-2 rounded-pill"
                  th:classappend="${c.gratuit} ? 'bg-success' : 'bg-primary'"
                  th:text="${c.gratuit ? 'Gratuit' : #numbers.formatDecimal(c.prix,1,0) + ' TND'}">
              Prix
            </span>
            <span th:if="${!c.actif}"
                  class="badge bg-secondary position-absolute bottom-0 start-0 m-2">Inactif</span>
          </div>

          <div class="card-body d-flex flex-column p-3">
            <!-- Category + Formateur -->
            <div class="d-flex align-items-center justify-content-between mb-2">
              <span class="badge bg-primary bg-opacity-10 text-primary rounded-pill small"
                    th:text="${c.categorie ?: 'Général'}">Cat</span>
              <span class="text-muted" style="font-size:0.72rem;"
                    th:text="${c.formateur != null ? c.formateur.nom : '—'}">Formateur</span>
            </div>

            <h3 class="card-title h6 fw-bold mb-2" th:text="${c.titre}">Titre</h3>
            <p class="text-muted small flex-grow-1 mb-3"
               th:text="${#strings.abbreviate(c.description ?: '', 90)}">Desc</p>

            <!-- Duration -->
            <div class="text-muted small mb-3" th:if="${c.dureeHeures != null}">
              <i class="bi bi-clock me-1"></i>
              <span th:text="${c.dureeHeures} + ' h de contenu'"></span>
            </div>

            <!-- Actions -->
            <div class="d-flex gap-2 mt-auto">
              <a class="btn btn-primary btn-sm flex-grow-1" th:href="@{/ui/cours/{id}(id=${c.id})}">
                <i class="bi bi-eye me-1"></i>Voir
              </a>
              <!-- Pay button for students -->
              <a sec:authorize="hasRole('APPRENANT')"
                 th:if="${!c.gratuit}"
                 class="btn btn-success btn-sm"
                 th:href="@{/ui/paiements/cours/{id}(id=${c.id})}"
                 title="Payer">
                <i class="bi bi-credit-card"></i>
              </a>
              <a sec:authorize="hasAnyRole('ADMIN','FORMATEUR')"
                 class="btn btn-outline-secondary btn-sm btn-icon"
                 th:href="@{/ui/cours/{id}/edit(id=${c.id})}" title="Modifier">
                <i class="bi bi-pencil"></i>
              </a>
              <form sec:authorize="hasAnyRole('ADMIN','FORMATEUR')"
                    th:action="@{/ui/cours/{id}/delete(id=${c.id})}" method="post" class="m-0"
                    onsubmit="return confirm('Supprimer ce cours ?')">
                <button class="btn btn-outline-danger btn-sm btn-icon" type="submit" title="Supprimer">
                  <i class="bi bi-trash"></i>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty -->
    <div class="text-center py-5" th:if="${#lists.isEmpty(cours)}">
      <i class="bi bi-collection text-muted" style="font-size:3.5rem;"></i>
      <h3 class="h5 mt-3">Aucun cours disponible</h3>
      <p class="text-muted small">Créez votre premier cours pour commencer.</p>
      <a sec:authorize="hasAnyRole('ADMIN','FORMATEUR')" th:href="@{/ui/cours/new}" class="btn btn-primary">
        <i class="bi bi-plus-lg me-1"></i>Créer un cours
      </a>
    </div>

    <!-- Pagination -->
    <nav th:if="${page.totalPages > 1}">
      <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
          <a class="page-link" th:href="@{/ui/cours(page=${page.number - 1})}">
            <i class="bi bi-chevron-left"></i>
          </a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:classappend="${i == page.number} ? 'active'">
          <a class="page-link" th:href="@{/ui/cours(page=${i})}" th:text="${i + 1}">1</a>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
          <a class="page-link" th:href="@{/ui/cours(page=${page.number + 1})}">
            <i class="bi bi-chevron-right"></i>
          </a>
        </li>
      </ul>
    </nav>

  </div>
</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
