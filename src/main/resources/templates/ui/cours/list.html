<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/fragments :: head('Cours')"></head>
<body>
<div th:replace="layout/fragments :: navbar"></div>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 m-0">Cours</h1>
    <a class="btn btn-dark" th:href="@{/ui/cours/new}">Nouveau cours</a>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-striped align-middle mb-0">
        <thead>
        <tr>
          <th>ID</th>
          <th>Titre</th>
          <th>Catégorie</th>
          <th>Niveau</th>
          <th>Formateur</th>
          <th>Actif</th>
          <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${cours}">
          <td th:text="${c.id}">1</td>
          <td th:text="${c.titre}">Titre</td>
          <td th:text="${c.categorie}">Cat</td>
          <td th:text="${c.niveau}">DEBUTANT</td>
          <td th:text="${c.formateur != null ? c.formateur.nom : '-'}">-</td>
          <td>
            <span class="badge" th:classappend="${c.actif} ? ' text-bg-success' : ' text-bg-secondary'"
                  th:text="${c.actif} ? 'Oui' : 'Non'">Oui</span>
          </td>
          <td class="text-end">
            <a class="btn btn-outline-primary btn-sm" th:href="@{|/ui/cours/${c.id}/edit|}">Modifier</a>
            <form th:action="@{|/ui/cours/${c.id}/delete|}" method="post" class="d-inline">
              <button class="btn btn-outline-danger btn-sm" type="submit"
                      onclick="return confirm('Supprimer ce cours ?');">Supprimer</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(cours)}">
          <td colspan="7" class="text-center text-muted py-4">Aucun cours.</td>
          <td></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div th:replace="layout/fragments :: footer"></div>
<div th:replace="layout/fragments :: scripts"></div>
</body>
</html>
