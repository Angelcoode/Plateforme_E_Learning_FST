<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Mes Paiements')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/fragments :: navbar}"></nav>

<main class="container my-5 flex-grow-1">
  <div class="page-header d-flex justify-content-between align-items-start mb-4">
    <div>
      <h1 class="page-title"><i class="bi bi-receipt text-primary me-2"></i>Mes Paiements</h1>
      <p class="text-muted small mt-1 mb-0">Historique de vos transactions</p>
    </div>
    <a th:href="@{/ui/cours}" class="btn btn-outline-primary btn-sm rounded-pill px-3">
      <i class="bi bi-collection-play me-1"></i>Voir les cours
    </a>
  </div>

  <div class="card shadow-sm border-0" th:if="${not #lists.isEmpty(paiements)}">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-3">Référence</th>
            <th>Cours</th>
            <th>Montant</th>
            <th>Méthode</th>
            <th>Date</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="p : ${paiements}">
            <td class="ps-3">
              <span class="font-monospace small fw-semibold text-primary" th:text="${p.reference}"></span>
            </td>
            <td>
              <a th:href="@{/ui/cours/{id}(id=${p.cours.id})}"
                 class="text-decoration-none fw-semibold small" th:text="${p.cours.titre}">Cours</a>
            </td>
            <td>
              <span class="fw-bold" th:text="${#numbers.formatDecimal(p.montant,1,2)} + ' TND'">0</span>
            </td>
            <td>
              <span class="badge bg-light text-dark border small" th:text="${p.methode ?: '—'}">—</span>
            </td>
            <td>
              <span class="small text-muted"
                    th:text="${#temporals.format(p.dateCreation,'dd/MM/yyyy')}">—</span>
            </td>
            <td>
              <span class="badge rounded-pill px-2 py-1"
                    th:classappend="${p.statut.name() == 'VALIDE'} ? 'bg-success' :
                                    (${p.statut.name() == 'EN_ATTENTE'} ? 'bg-warning text-dark' :
                                    (${p.statut.name() == 'REFUSE'} ? 'bg-danger' : 'bg-secondary'))"
                    th:text="${p.statut}">STATUT</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div th:if="${#lists.isEmpty(paiements)}" class="text-center py-5">
    <i class="bi bi-receipt text-muted" style="font-size:3rem;"></i>
    <h3 class="h5 mt-3">Aucun paiement trouvé</h3>
    <p class="text-muted small">Inscrivez-vous à un cours pour commencer.</p>
    <a th:href="@{/ui/cours}" class="btn btn-primary rounded-pill px-4">Voir le catalogue</a>
  </div>
</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
