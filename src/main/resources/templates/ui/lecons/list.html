<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Leçons')}"></head>

<style>
  body {
    background: linear-gradient(135deg, #f5f7fa, #e9eff7);
    overflow-x: hidden;
  }

  /* Animation d'apparition */
  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(25px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .animated-page {
    animation: fadeUp 0.7s ease-in-out;
  }

  /* Header */
  .page-header {
    margin-bottom: 1.5rem;
    animation: fadeUp 0.5s ease;
  }

  .page-title {
    font-size: 2rem;
    font-weight: 700;
    color: #1f2937;
  }

  /* Card premium */
  .modern-card {
    border: none;
    border-radius: 18px;
    overflow: hidden;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    animation: fadeUp 0.8s ease;
  }

  /* Table */
  .table thead {
    background: #f8fafc;
  }

  .table thead th {
    font-weight: 600;
    color: #475569;
    border-bottom: none;
    padding: 16px;
  }

  .table tbody td {
    padding: 16px;
    vertical-align: middle;
    border-top: 1px solid #eef2f7;
  }

  .table tbody tr {
    transition: all 0.25s ease;
  }

  .table tbody tr:hover {
    background: #f8fbff;
    transform: scale(1.002);
  }

  /* Boutons */
  .btn-primary {
    border: none;
    border-radius: 12px;
    padding: 10px 18px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    box-shadow: 0 6px 16px rgba(37,99,235,0.25);
    transition: all 0.3s ease;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(37,99,235,0.35);
  }

  .btn-outline-primary,
  .btn-outline-danger {
    border-radius: 10px;
    transition: all 0.25s ease;
  }

  .btn-outline-primary:hover,
  .btn-outline-danger:hover {
    transform: translateY(-2px);
  }

  /* Badge */
  .custom-badge {
    background: #eef2ff;
    color: #1d4ed8;
    padding: 6px 10px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.8rem;
  }

  /* Etat vide */
  .empty-state {
    padding: 50px;
    color: #94a3b8;
    font-size: 1rem;
  }
</style>

<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/fragments :: navbar}"></nav>

<main class="container my-5 flex-grow-1 animated-page">

  <div class="page-header d-flex justify-content-between align-items-center">
    <h1 class="page-title">
      <i class="bi bi-file-earmark-play text-primary me-2"></i>Leçons
    </h1>
    <a class="btn btn-primary" th:href="@{/ui/lecons/new}">
      <i class="bi bi-plus-lg me-1"></i>Nouvelle leçon
    </a>
  </div>

  <div class="card modern-card">
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Titre</th>
            <th>Module</th>
            <th>Ordre</th>
            <th>Durée</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="l : ${lecons}">
            <td class="text-muted small fw-medium" th:text="${l.id}">1</td>
            <td class="fw-semibold text-dark" th:text="${l.titre}">Titre</td>
            <td class="text-muted small"
                th:text="${l.module != null ? l.module.titre : '—'}">—</td>
            <td>
              <span class="custom-badge" th:text="${l.ordre}">1</span>
            </td>
            <td class="text-muted small"
                th:text="${l.dureeMin} + ' min'">15 min</td>
            <td class="text-end">
              <a class="btn btn-outline-primary btn-sm me-1"
                 th:href="@{/ui/lecons/{id}/edit(id=${l.id})}">
                <i class="bi bi-pencil"></i>
              </a>

              <form th:action="@{/ui/lecons/{id}/delete(id=${l.id})}"
                    method="post"
                    class="d-inline"
                    onsubmit="return confirm('Supprimer cette leçon ?');">
                <button class="btn btn-outline-danger btn-sm" type="submit">
                  <i class="bi bi-trash"></i>
                </button>
              </form>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(lecons)}">
            <td colspan="6" class="text-center empty-state">
              <i class="bi bi-inbox fs-2 d-block mb-2"></i>
              Aucune leçon créée.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<div th:replace="~{layout/fragments :: scripts}"></div>

</body>
</html>
