<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/fragments :: head(${module.id} != null ? 'Modifier module' : 'Nouveau module')"></head>
<body>
<div th:replace="layout/fragments :: navbar"></div>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 m-0" th:text="${module.id} != null ? 'Modifier module' : 'Nouveau module'">Module</h1>
    <a class="btn btn-outline-secondary" th:href="@{/ui/modules}">Retour</a>
  </div>

  <div class="card">
    <div class="card-body">
      <form th:object="${module}"
            th:action="${module.id} != null ? @{|/ui/modules/${module.id}|} : @{/ui/modules}"
            method="post" class="row g-3">

        <div class="col-12">
          <label class="form-label">Titre</label>
          <input class="form-control" th:field="*{titre}" required />
        </div>

        <div class="col-12 col-md-4">
          <label class="form-label">Ordre</label>
          <input class="form-control" type="number" min="1" th:field="*{ordre}" />
        </div>

        <div class="col-12 col-md-8">
          <label class="form-label">Cours</label>
          <select class="form-select" name="coursId">
            <option value="" th:selected="${module.cours == null}">—</option>
            <option th:each="c : ${cours}"
                    th:value="${c.id}"
                    th:selected="${module.cours != null and module.cours.id == c.id}"
                    th:text="${c.titre}">Cours</option>
          </select>
        </div>

        <div class="col-12">
          <button class="btn btn-dark" type="submit">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</main>

<div th:replace="layout/fragments :: footer"></div>
<div th:replace="layout/fragments :: scripts"></div>
</body>
</html>
