<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/fragments :: head('Modules')"></head>
<body>
<div th:replace="layout/fragments :: navbar"></div>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 m-0">Modules</h1>
    <a class="btn btn-dark" th:href="@{/ui/modules/new}">Nouveau module</a>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-striped align-middle mb-0">
        <thead>
        <tr>
          <th>ID</th>
          <th>Titre</th>
          <th>Ordre</th>
          <th>Cours</th>
          <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${modules}">
          <td th:text="${m.id}">1</td>
          <td th:text="${m.titre}">Titre</td>
          <td th:text="${m.ordre}">1</td>
          <td th:text="${m.cours != null ? m.cours.titre : '-'}">-</td>
          <td class="text-end">
            <a class="btn btn-outline-primary btn-sm" th:href="@{|/ui/modules/${m.id}/edit|}">Modifier</a>
            <form th:action="@{|/ui/modules/${m.id}/delete|}" method="post" class="d-inline">
              <button class="btn btn-outline-danger btn-sm" type="submit"
                      onclick="return confirm('Supprimer ce module ?');">Supprimer</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(modules)}">
          <td colspan="4" class="text-center text-muted py-4">Aucun module.</td>
          <td></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div th:replace="layout/fragments :: footer"></div>
<div th:replace="layout/fragments :: scripts"></div>
</body>
</html>
