<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Progressions')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/fragments :: navbar}"></nav>
<main class="container my-5 flex-grow-1">
  <div class="page-header d-flex justify-content-between align-items-center">
    <h1 class="page-title"><i class="bi bi-graph-up text-primary me-2"></i>Progressions</h1>
    <a class="btn btn-primary" th:href="@{/ui/progressions/new}"><i class="bi bi-plus-lg me-1"></i>Nouvelle progression</a>
  </div>
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead><tr>
          <th>ID</th><th>Apprenant</th><th>Leçon</th><th>Complétée</th><th>Date complétion</th><th class="text-end">Actions</th>
        </tr></thead>
        <tbody>
          <tr th:each="p : ${progressions}">
            <td class="text-muted small" th:text="${p.id}">1</td>
            <td class="fw-medium small" th:text="${p.apprenant != null ? p.apprenant.nom : '—'}">Nom</td>
            <td class="text-muted small" th:text="${p.lecon != null ? p.lecon.titre : '—'}">Leçon</td>
            <td>
              <span class="badge" th:classappend="${p.completee} ? 'text-bg-success' : 'text-bg-secondary'"
                    th:text="${p.completee} ? 'Oui' : 'Non'">Non</span>
            </td>
            <td class="text-muted small" th:text="${p.dateCompletion != null ? #temporals.format(p.dateCompletion,'dd/MM/yyyy HH:mm') : '—'}">—</td>
            <td class="text-end">
              <a class="btn btn-outline-primary btn-sm me-1" th:href="@{/ui/progressions/{id}/edit(id=${p.id})}"><i class="bi bi-pencil"></i></a>
              <form th:action="@{/ui/progressions/{id}/delete(id=${p.id})}" method="post" class="d-inline"
                    onsubmit="return confirm('Supprimer cette progression ?');">
                <button class="btn btn-outline-danger btn-sm" type="submit"><i class="bi bi-trash"></i></button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(progressions)}">
            <td colspan="6" class="text-center text-muted py-5">Aucune progression enregistrée.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<footer th:replace="~{layout/fragments :: footer}"></footer>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
