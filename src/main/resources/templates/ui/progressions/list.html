<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/fragments :: head('Progressions')"></head>
<body>
<div th:replace="layout/fragments :: navbar"></div>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 m-0">Progressions</h1>
    <a class="btn btn-dark" th:href="@{/ui/progressions/new}">Nouvelle progression</a>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-striped align-middle mb-0">
        <thead>
        <tr>
          <th>ID</th>
          <th>Apprenant</th>
          <th>Lesson</th>
          <th>Complétée</th>
          <th>Date completion</th>
          <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${progressions}">
          <td th:text="${p.id}">1</td>
          <td th:text="${p.apprenant != null ? p.apprenant.nom : '-'}">-</td>
          <td th:text="${p.lesson != null ? p.lesson.titre : '-'}">-</td>
          <td>
            <span class="badge" th:classappend="${p.completee} ? ' text-bg-success' : ' text-bg-secondary'"
                  th:text="${p.completee} ? 'Oui' : 'Non'">Oui</span>
          </td>
          <td th:text="${p.dateCompletion}">2026-01-01T12:00</td>
          <td class="text-end">
            <a class="btn btn-outline-primary btn-sm" th:href="@{|/ui/progressions/${p.id}/edit|}">Modifier</a>
            <form th:action="@{|/ui/progressions/${p.id}/delete|}" method="post" class="d-inline">
              <button class="btn btn-outline-danger btn-sm" type="submit"
                      onclick="return confirm('Supprimer cette progression ?');">Supprimer</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(progressions)}">
          <td colspan="5" class="text-center text-muted py-4">Aucune progression.</td>
          <td></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div th:replace="layout/fragments :: footer"></div>
<div th:replace="layout/fragments :: scripts"></div>
</body>
</html>
