<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(${progression.id != null ? 'Modifier progression' : 'Nouvelle progression'})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/fragments :: navbar}"></nav>
<main class="container my-5 flex-grow-1" style="max-width:640px;">
  <div class="d-flex align-items-center gap-3 mb-4">
    <a th:href="@{/ui/progressions}" class="btn btn-sm btn-outline-secondary btn-icon"><i class="bi bi-arrow-left"></i></a>
    <h1 class="page-title" th:text="${progression.id != null ? 'Modifier progression' : 'Nouvelle progression'}">Progression</h1>
  </div>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form th:object="${progression}"
            th:action="${progression.id != null ? '/ui/progressions/' + progression.id : '/ui/progressions'}"
            method="post" class="row g-3">
        <div class="col-12">
          <label class="form-label">Apprenant</label>
          <select class="form-select" name="apprenantId">
            <option value="">— Choisir —</option>
            <option th:each="u : ${apprenants}" th:value="${u.id}"
                    th:selected="${progression.apprenant != null and progression.apprenant.id == u.id}"
                    th:text="${u.nom + ' (' + u.email + ')'}">Apprenant</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Leçon</label>
          <select class="form-select" name="leconId">
            <option value="">— Choisir —</option>
            <option th:each="l : ${lecons}" th:value="${l.id}"
                    th:selected="${progression.lecon != null and progression.lecon.id == l.id}"
                    th:text="${l.titre + (l.module != null ? ' (' + l.module.titre + ')' : '')}">Leçon</option>
          </select>
        </div>
        <div class="col-12">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="completee" th:field="*{completee}" role="switch"/>
            <label class="form-check-label fw-medium" for="completee">Leçon complétée</label>
          </div>
        </div>
        <div class="col-12 d-flex gap-2">
          <button class="btn btn-primary px-4" type="submit"><i class="bi bi-check-lg me-1"></i>Enregistrer</button>
          <a th:href="@{/ui/progressions}" class="btn btn-outline-secondary px-4">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</main>
<footer th:replace="~{layout/fragments :: footer}"></footer>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
