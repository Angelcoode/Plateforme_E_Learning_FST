<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/fragments :: head(${lesson.id} != null ? 'Modifier lesson' : 'Nouvelle lesson')"></head>
<body>
<div th:replace="layout/fragments :: navbar"></div>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 m-0" th:text="${lesson.id} != null ? 'Modifier lesson' : 'Nouvelle lesson'">Lesson</h1>
    <a class="btn btn-outline-secondary" th:href="@{/ui/lessons}">Retour</a>
  </div>

  <div class="card">
    <div class="card-body">
      <form th:object="${lesson}"
            th:action="${lesson.id} != null ? @{|/ui/lessons/${lesson.id}|} : @{/ui/lessons}"
            method="post" class="row g-3">

        <div class="col-12">
          <label class="form-label">Titre</label>
          <input class="form-control" th:field="*{titre}" required />
        </div>

        <div class="col-12">
          <label class="form-label">Contenu</label>
          <textarea class="form-control" rows="6" th:field="*{contenu}"></textarea>
        </div>

        <div class="col-12 col-md-4">
          <label class="form-label">Ordre</label>
          <input class="form-control" type="number" min="1" th:field="*{ordre}" />
        </div>

        <div class="col-12 col-md-4">
          <label class="form-label">Durée (min)</label>
          <input class="form-control" type="number" min="0" th:field="*{dureeMin}" />
        </div>

        <div class="col-12 col-md-4">
          <label class="form-label">Module</label>
          <select class="form-select" name="moduleId">
            <option value="" th:selected="${lesson.module == null}">—</option>
            <option th:each="m : ${modules}"
                    th:value="${m.id}"
                    th:selected="${lesson.module != null and lesson.module.id == m.id}"
                    th:text="${m.titre}">Module</option>
          </select>
        </div>

        <div class="col-12">
          <button class="btn btn-dark" type="submit">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</main>

<div th:replace="layout/fragments :: footer"></div>
<div th:replace="layout/fragments :: scripts"></div>
</body>
</html>
