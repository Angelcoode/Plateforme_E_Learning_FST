<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Erreur')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/fragments :: navbar}"></nav>

<main class="container my-5 flex-grow-1 text-center">
  <div class="py-5">
    <i class="bi bi-exclamation-triangle text-warning" style="font-size:4rem;"></i>
    <h1 class="h3 fw-bold mt-3 mb-2">Une erreur est survenue</h1>
    <p class="text-muted" th:text="${message ?: 'Désolé, quelque chose a mal tourné.'}">Erreur</p>
    <div class="d-flex justify-content-center gap-2 mt-4">
      <a th:href="@{/dashboard}" class="btn btn-primary rounded-pill px-4">
        <i class="bi bi-house me-1"></i>Retour au tableau de bord
      </a>
      <a th:href="@{/home}" class="btn btn-outline-secondary rounded-pill px-4">
        <i class="bi bi-arrow-left me-1"></i>Accueil
      </a>
    </div>
  </div>
</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
