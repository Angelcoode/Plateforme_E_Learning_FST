<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/fragments :: head('Connexion')"></head>
<body class="bg-light">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-5">
      <div class="card shadow-sm mt-5">
        <div class="card-body p-4">
          <h1 class="h4 mb-3">Connexion</h1>
          <p class="text-muted mb-4">Connecte-toi pour accéder à l’interface.</p>

          <div class="alert alert-danger" th:if="${param.error}">
            Identifiants invalides.
          </div>
          <div class="alert alert-success" th:if="${param.logout}">
            Déconnecté avec succès.
          </div>

          <form th:action="@{/login}" method="post" class="vstack gap-3">
            <div>
              <label class="form-label" for="username">Email / Username</label>
              <input class="form-control" id="username" name="username" autocomplete="username" required />
            </div>
            <div>
              <label class="form-label" for="password">Mot de passe</label>
              <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required />
            </div>
            <button class="btn btn-dark w-100" type="submit">Se connecter</button>
          </form>

          <div class="text-muted small mt-3">
            Astuce: si tu n’as pas encore configuré l’auth, Spring Security génère un mot de passe au démarrage (console).
          </div>
        </div>
      </div>

      <div class="text-center mt-3">
        <a class="link-secondary" th:href="@{/ui}">Continuer vers le dashboard</a>
      </div>
    </div>
  </div>
</div>

<div th:replace="layout/fragments :: scripts"></div>
</body>
</html>
