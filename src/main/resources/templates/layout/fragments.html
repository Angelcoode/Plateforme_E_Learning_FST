<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${title}">E-Learning</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link th:href="@{/css/app.css}" rel="stylesheet" />
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/ui}">E‑Learning FST</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" th:href="@{/ui/cours}">Cours</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/ui/modules}">Modules</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/ui/lessons}">Lessons</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/ui/inscriptions}">Inscriptions</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/ui/progressions}">Progressions</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/ui/utilisateurs}">Utilisateurs</a></li>
      </ul>

      <div class="d-flex gap-2 align-items-center">
        <span class="text-white-50 small" sec:authorize="isAuthenticated()">
          Connecté: <span sec:authentication="name">user</span>
        </span>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
          <button class="btn btn-outline-light btn-sm" type="submit">Déconnexion</button>
        </form>
        <a sec:authorize="!isAuthenticated()" class="btn btn-outline-light btn-sm" th:href="@{/login}">Connexion</a>
      </div>
    </div>
  </div>
</nav>

<footer th:fragment="footer" class="border-top py-4 mt-5">
  <div class="container">
    <div class="text-muted small">Plateforme E‑Learning FST — Thymeleaf + Bootstrap</div>
  </div>
</footer>

<div th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
